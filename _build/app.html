<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dMAT Master Practice</title>
<style>
:root{
  --paper:#F6F7F9; --ink:#1B2330; --muted:#5A6576; --line:#D5DBE3; --panel:#E6EAF0; --card:#FFFFFF;
  --navy:#173A5E; --navy2:#0F2A45; --focus:#2F6FB3;
  --amber:#B7791F; --amberbg:#FFF4E0; --ok:#2E7D4F; --okbg:#E6F4EC; --bad:#B3261E; --badbg:#FCE9E7;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:Cambria,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1{font-size:2rem;line-height:1.2;margin:.2em 0 .4em;font-weight:650;letter-spacing:-.01em}
h2{font-size:1.35rem;margin:1.4em 0 .5em;font-weight:650}
h3{font-size:1.05rem;margin:1.1em 0 .4em;font-weight:650}
p{margin:.4em 0 .8em}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 80px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:.55em 1.1em;cursor:pointer;min-height:42px}
.btn:hover{border-color:#9AA7B8}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* start screens */
.hero{padding:40px 0 10px}
.hero p{max-width:62ch;color:var(--muted);font-size:1.05rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.mode{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--navy);padding:22px 24px;border-radius:4px}
.mode.practice{border-top-color:#4B6A88}
.mode ul{margin:.3em 0 1em;padding-left:1.1em}
.mode li{margin:.2em 0}
.facts{width:100%;border-collapse:collapse;background:var(--card);margin:.5em 0 1em}
.facts th,.facts td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.facts th{background:var(--panel);font-weight:600}
.tag{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:10px;background:var(--panel);color:var(--muted)}
.tag.off{background:#DDE8F4;color:var(--navy)}
.tag.cus{background:var(--amberbg);color:#7A4E0E}
/* exam chrome */
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:stretch;justify-content:space-between;gap:16px;padding:0 16px;min-height:74px}
.bar .where{display:flex;flex-direction:column;justify-content:center;padding:8px 0}
.bar .mod{font-size:.78rem;letter-spacing:.08em;opacity:.8}
.bar .sec{font-size:1.2rem;font-weight:650;letter-spacing:.04em}
.bar .clock{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:8px 0}
.bar .clock .lbl{font-size:.72rem;letter-spacing:.08em;opacity:.8}
.bar .clock .t{font-size:2rem;font-weight:650;line-height:1.05}
.bar .clock.warn .t{color:#FFD28A}
.bar .clock.crit .t{color:#FF9B8F;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.bar .clock.crit .t{animation:none}}
.qhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:18px 0 6px;flex-wrap:wrap}
.qno{font-weight:650;font-size:1.05rem}
.qtime{text-align:right}
.qtime .lbl{font-size:.72rem;letter-spacing:.08em;color:var(--muted)}
.qtime .v{font-size:1.35rem;font-weight:650}
.pace{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:14px}
.pace i{display:block;height:100%;width:0;background:#6F8FB0;transition:width .2s linear}
.pace.warn i{background:var(--amber)} .pace.over i{background:var(--bad);width:100%!important}
.qtime.over .v{color:var(--bad)} .qtime.warn .v{color:var(--amber)}
.stem{font-size:1.02rem;margin:4px 0 12px}
.fig{background:#fff;border:1px solid var(--line);padding:10px;border-radius:4px;overflow-x:auto}
.fig img{display:block;max-width:100%;height:auto;margin:0 auto}
/* FS */
.fsopts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.fscol h4{margin:0 0 6px;font-size:.95rem}
.optimg{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:2px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:10px;cursor:pointer;text-align:left}
.optimg img{max-width:100%;max-height:190px;height:auto;display:block}
.optimg .L{font-weight:700;min-width:1.6em;font-size:1.1rem}
.optimg:hover{border-color:#8FA3BA}
.sel{border-color:var(--navy)!important;box-shadow:0 0 0 3px #C9D9EC;background:#F3F7FC!important}
/* LS */
.lswrap{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.lswrap .fig{flex:0 1 auto}
.lswrap .fig img{max-width:min(460px,100%)}
.letters{display:flex;flex-direction:column;gap:10px}
.lbtn{width:64px;height:56px;font-size:1.4rem;font-weight:650;background:#fff;border:2px solid var(--line);border-radius:6px;cursor:pointer}
/* ME */
.eqs{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px 22px;font-size:1.45rem;line-height:1.7;display:inline-block;min-width:280px}
.eqs div{white-space:nowrap}
.pick{margin:14px 0}
.pickrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.pickrow .L{font-weight:700;font-size:1.3rem;width:1.8em}
.nums{display:grid;grid-template-columns:repeat(10,40px);gap:5px}
.nb{height:38px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-weight:600}
.pickrow .val{min-width:3.2em;font-weight:700;font-size:1.2rem;color:var(--navy)}
/* GA */
.ga{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.passage{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px 20px;max-height:calc(100vh - 200px);overflow:auto;position:sticky;top:90px}
.passage.txt{font:17px/1.62 var(--serif);max-width:none}
.passage.txt p{max-width:72ch}
.passage img{max-width:100%;height:auto;display:block;margin:0 auto 8px}
.passage h3{font-family:var(--sans)}
.ptable{border-collapse:collapse;margin:10px 0 4px;font:15px/1.4 var(--sans)}
.ptable th,.ptable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ptable th{background:var(--panel)}
.cap{font-size:.9rem;color:var(--muted)}
.gaopt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;cursor:pointer}
.gaopt .L{font-weight:700;min-width:1.4em}
.gaopt img{max-width:100%;height:auto;display:block}
.stemimgs img{max-width:100%;height:auto;display:block;margin-bottom:4px}
.strat{background:var(--amberbg);border:1px solid #E8CF9F;border-radius:4px;padding:10px 14px;margin:8px 0}
/* bottom nav */
.nav{position:sticky;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pal{display:flex;flex-wrap:wrap;gap:4px;max-width:640px}
.pal button{width:34px;height:30px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font-size:.8rem;position:relative}
.pal button.ans{background:#DCE6F2;border-color:#9DB3CC}
.pal button.cur{outline:2px solid var(--navy)}
.pal button.flag::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;background:var(--amber);border-radius:50%}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,25,40,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:6px;max-width:520px;width:100%;padding:22px 24px}
.toast{position:fixed;right:16px;top:86px;z-index:60;background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;max-width:320px}
/* review */
.rv{background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:4px;padding:14px 18px;margin:16px 0}
.rv.ok{border-left-color:var(--ok)} .rv.bad{border-left-color:var(--bad)} .rv.skip{border-left-color:#9AA7B8}
.rv .stemimgs img,.rv .gaopt img{max-width:min(620px,100%)}
.rv .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 16px;margin:10px 0;font-size:.93rem}
.rv .why{background:var(--paper);border-radius:4px;padding:10px 12px;margin-top:8px}
.o-ok{border-color:var(--ok)!important;background:var(--okbg)!important}
.o-bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.res{font-weight:700}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}.res.skip{color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;cursor:pointer}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* analytics */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.kpi b{display:block;font-size:1.5rem;line-height:1.2}
.kpi span{font-size:.84rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;background:#fff;margin:8px 0 16px;font-size:.93rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.tbl th{background:var(--panel);font-weight:600}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px}
.chart{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px}
.chart h4{margin:0 0 6px;font-size:.95rem}
.status{padding:10px 14px;border-radius:4px;margin:6px 0;background:#fff;border:1px solid var(--line)}
.status.good{border-left:5px solid var(--ok)} .status.warn{border-left:5px solid var(--amber)} .status.bad{border-left:5px solid var(--bad)}
.recs li{margin:.35em 0}
.sectionlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}
.sectionlist .btn{text-align:left;padding:14px 16px;height:auto}
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.pitem{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px}
@media (max-width:820px){
  .modes,.ga,.fsopts{grid-template-columns:1fr}
  .passage{position:static;max-height:none}
  .nav{position:static}
  .nums{grid-template-columns:repeat(5,44px)}
  .bar .clock .t{font-size:1.5rem}
  h1{font-size:1.6rem}
}
@media print{.bar,.nav{position:static}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BANK = /*__BANK__*/null;
/* ============================================================ utilities */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IMG = h => BANK.assets[h];
const TARGET = 75000;
const fmtClock = ms => { ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const sec1 = ms => (ms / 1000).toFixed(1);
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const LET = 'ABCDE';
const SEC = { FS: 'Figure Sequences', ME: 'Mathematical Equations', LS: 'Latin Squares', GA: 'General Academic Module', CORE: 'Core practice' };
// pace used for judging speed: 75 s for Core questions; the GA module allows 90 min for the 26-question simulation (~208 s)
const paceTarget = sec => sec === 'GA' ? Math.round(90 * 60 / 26) : 75;

/* ============================================================ bank index */
const QMAP = {}, PMAP = {};
function indexBank() {
  for (const k of ['FS', 'ME', 'LS']) for (const q of BANK.actual.core[k]) QMAP[q.id] = q;
  for (const q of BANK.practice.core) QMAP[q.id] = q;
  for (const set of [BANK.actual.ga, BANK.practice.ga]) for (const p of set) for (const q of p.questions) { QMAP[q.id] = q; PMAP[q.id] = p; }
}

/* ============================================================ storage (per-browser convenience; app works without it) */
const KEY = 'dmat_master_v1';
const store = {
  data: { attempts: [], inprogress: null },
  load() { try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && Array.isArray(d.attempts)) this.data = d; } catch (e) { } },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { } },
};

/* ============================================================ scoring */
function isAnswered(q, a) {
  if (a == null) return false;
  if (q.section === 'FS') return a[0] != null || a[1] != null;
  if (q.section === 'ME') return Object.values(a).some(v => v != null);
  return true;
}
function isCorrect(q, a) {
  if (!isAnswered(q, a)) return false;
  if (q.section === 'FS') return a[0] === q.correctAnswer[0] && a[1] === q.correctAnswer[1];
  if (q.section === 'ME') return q.letters.every(L => a[L] === q.correctAnswer[L]);
  return a === q.correctAnswer;
}
function fmtAnswer(q, a) {
  if (!isAnswered(q, a)) return '—';
  if (q.section === 'FS') return `Matrix 5: ${a[0] == null ? '—' : 'ABC'[a[0]]}, Matrix 6: ${a[1] == null ? '—' : 'ABC'[a[1]]}`;
  if (q.section === 'ME') return q.letters.map(L => `${L} = ${a[L] ?? '—'}`).join(', ');
  if (q.section === 'GA') return 'abcd'[a] + ')';
  return a;
}
const fmtKey = q => q.section === 'FS' ? fmtAnswer(q, q.correctAnswer) : q.section === 'ME' ? fmtAnswer(q, q.correctAnswer) : q.section === 'GA' ? 'abcd'[q.correctAnswer] + ')' : q.correctAnswer;

/* ============================================================ timer engine
   One driver interval for the whole app. Each Session keeps:
   - section clock: wall-clock start + limit (controlling timer, auto-submits at 0)
   - per-question active time: accumulated ms + current visit start (performance.now) */
const Driver = {
  handle: null, session: null,
  attach(s) { this.detach(); this.session = s; this.handle = setInterval(() => this.tick(), 200); },
  detach() { if (this.handle !== null) clearInterval(this.handle); this.handle = null; this.session = null; },
  tick() { const s = this.session; if (!s) return; if (s.submitted) { this.detach(); return; } s.tick(); },
};

class Session {
  constructor(cfg) {
    Object.assign(this, cfg); // {mode, kind, section, label, module, qids, limitMs|null, next}
    this.idx = 0; this.submitted = false; this.reason = null;
    this.records = {};
    for (const id of this.qids) this.records[id] = { questionId: id, section: QMAP[id].section, visits: [], timeSpentMs: 0, selectedAnswer: null, flagged: false, changes: 0 };
    this.startWall = null; this.activeSince = null; this.warned = {};
    this.strategy = {}; // GA practice: passageId -> strategy
  }
  start(resumeElapsed = 0) {
    this.startPerf = performance.now() - resumeElapsed;   // section clock: monotonic, immune to system-clock changes
    this.enter(this.idx);
  }
  elapsed() { return this.submitted ? this.finalElapsed : performance.now() - this.startPerf; }
  remaining() { return this.limitMs == null ? null : Math.max(0, this.limitMs - this.elapsed()); }
  cur() { return this.records[this.qids[this.idx]]; }
  enter(i) {
    if (this.submitted) return;
    this.leave();
    this.idx = i; this.activeSince = performance.now();
    this.cur().visits.push({ start: Date.now(), end: null, ms: 0 });
  }
  leave() {
    if (this.activeSince == null) return;
    const dt = performance.now() - this.activeSince, r = this.cur(), v = r.visits[r.visits.length - 1];
    r.timeSpentMs += dt; v.end = Date.now(); v.ms = dt; this.activeSince = null;
  }
  qTime() { const r = this.cur(); return r.timeSpentMs + (this.activeSince == null ? 0 : performance.now() - this.activeSince); }
  answer(a) {
    if (this.submitted) return;
    const r = this.cur(); if (r.selectedAnswer !== null && JSON.stringify(r.selectedAnswer) !== JSON.stringify(a)) r.changes++;
    r.selectedAnswer = a; this.persist();
  }
  tick() {
    const rem = this.remaining();
    if (rem !== null && rem <= 0) { if (App.session === this) finishSection('timeout'); else this.submit('timeout'); return; }
    UI.tick(this);
  }
  submit(reason) {
    if (this.submitted) return false;          // double-submit guard
    this.leave();
    this.finalElapsed = Math.min(performance.now() - this.startPerf, this.limitMs ?? Infinity);
    this.submitted = true; this.reason = reason; Driver.detach();
    const recs = this.qids.map(id => {
      const r = this.records[id], q = QMAP[id];
      const answered = isAnswered(q, r.selectedAnswer), correct = isCorrect(q, r.selectedAnswer);
      return Object.assign(r, { correctAnswer: q.correctAnswer, correct, unanswered: !answered, targetTime: 75, timeSpent: +(r.timeSpentMs / 1000).toFixed(1),
        exceededTarget: r.timeSpentMs > TARGET, paceTargetS: paceTarget(q.section), revisited: r.visits.length > 1, startTs: r.visits[0]?.start ?? null, endTs: r.visits.length ? r.visits[r.visits.length - 1].end : null,
        difficulty: q.difficulty, type: q.type, passage: PMAP[id]?.id ?? null, topic: q.topic ?? null, strategy: PMAP[id] ? (this.strategy[PMAP[id].id] || null) : null });
    });
    const res = { mode: this.mode, kind: this.kind, section: this.section, label: this.label, limitMs: this.limitMs, elapsedMs: this.finalElapsed, reason, finishedAt: Date.now(), records: recs };
    store.data.inprogress = null; store.save();
    return res;
  }
  persist() {
    if (this.submitted) return;
    store.data.inprogress = { attempt: App.attempt, cfg: { mode: this.mode, kind: this.kind, section: this.section, label: this.label, module: this.module, qids: this.qids, limitMs: this.limitMs, flow: this.flow ?? null, flowStep: this.flowStep ?? null, attemptId: this.attemptId },
      idx: this.idx, elapsed: this.elapsed(), savedAt: Date.now(), strategy: this.strategy,
      records: Object.fromEntries(Object.entries(this.records).map(([k, r]) => [k, Object.assign({}, r, { timeSpentMs: k === this.qids[this.idx] ? this.qTime() : r.timeSpentMs, visits: r.visits.map(v => Object.assign({}, v)) })])) };
    store.save();
  }
}

/* ============================================================ flows */
const App = { session: null, attempt: null, lastSection: null };
function newAttempt(mode, kind, flow) { return { id: 'T' + Date.now(), mode, kind, flow, startedAt: Date.now(), sections: [] }; }
function saveAttempt(a) { const i = store.data.attempts.findIndex(x => x.id === a.id); if (i >= 0) store.data.attempts[i] = a; else store.data.attempts.push(a); store.save(); }

const ACTUAL_STEPS = ['FS', 'ME', 'LS', 'BREAK', 'GA'];
function actualCfg(sec) {
  if (sec === 'GA') return { module: 'SUBJECT MODULE', label: 'GENERAL ACADEMIC MODULE', section: 'GA', limitMs: 90 * 60e3, qids: BANK.actual.ga.flatMap(p => p.questions.map(q => q.id)) };
  return { module: 'CORE MODULE', label: SEC[sec].toUpperCase(), section: sec, limitMs: 25 * 60e3, qids: BANK.actual.core[sec].map(q => q.id) };
}
function startActual(flow) { // flow: 'full' | 'FS' | 'ME' | 'LS' | 'GA'
  App.attempt = newAttempt('actual', flow === 'full' ? 'actual-full' : 'actual-' + flow, flow);
  const first = flow === 'full' ? 'FS' : flow;
  UI.sectionIntro(first, flow === 'full' ? 0 : null);
}
function beginSection(cfg) {
  const s = new Session(Object.assign({ mode: App.attempt.mode, kind: App.attempt.kind, attemptId: App.attempt.id, flow: App.attempt.flow }, cfg));
  App.session = s; s.start(); s.persist(); Driver.attach(s); UI.test(s);
}
function finishSection(reason) {
  const s = App.session; if (!s) return;
  const res = s.submit(reason); if (!res) return;
  App.attempt.sections.push(res); App.attempt.finishedAt = Date.now();
  App.attempt.complete = !(App.attempt.mode === 'actual' && App.attempt.flow === 'full' && App.attempt.sections.length < 4);
  saveAttempt(App.attempt);
  App.lastSection = res; App.session = null;
  UI.sectionResults(res, reason === 'timeout');
}
function nextAfterSection() {
  const a = App.attempt;
  if (a.mode === 'actual' && a.flow === 'full') {
    const done = a.sections.map(s => s.section);
    const next = ACTUAL_STEPS.find(x => x !== 'BREAK' && !done.includes(x));
    if (!next) return UI.overall(a);
    if (next === 'GA' && !a.breakDone) return UI.breakScreen();
    return UI.sectionIntro(next, ACTUAL_STEPS.indexOf(next));
  }
  if (a.mode === 'actual') return UI.overall(a);
  return UI.practiceHome();
}

/* ============================================================ SVG charts */
function barChart(rows, { max, ref, unit = '', fmt = v => Math.round(v), refLabel = '' } = {}) {
  const W = 460, rh = 26, L = 150, H = rows.length * rh + 26;
  max = max || Math.max(1, ...rows.map(r => r.v), ref || 0);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="bar chart">`;
  rows.forEach((r, i) => {
    const y = 8 + i * rh, w = Math.max(0, (W - L - 60) * r.v / max);
    s += `<text x="${L - 8}" y="${y + 15}" text-anchor="end" font-size="12" fill="#1B2330">${esc(r.label)}</text>`;
    s += `<rect x="${L}" y="${y + 3}" width="${w}" height="16" rx="2" fill="${r.color || '#4B6A88'}"/>`;
    s += `<text x="${L + w + 5}" y="${y + 15}" font-size="12" fill="#5A6576">${esc(fmt(r.v))}${unit}</text>`;
  });
  if (ref) { const x = L + (W - L - 60) * ref / max; s += `<line x1="${x}" x2="${x}" y1="4" y2="${H - 16}" stroke="#B3261E" stroke-dasharray="4 3"/><text x="${x}" y="${H - 4}" font-size="11" text-anchor="middle" fill="#B3261E">${esc(refLabel)}</text>`; }
  return s + '</svg>';
}
function stackChart(rows) { // correct / incorrect / unanswered
  const W = 460, rh = 26, L = 150, H = rows.length * rh + 30;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="correct versus incorrect">`;
  rows.forEach((r, i) => {
    const y = 8 + i * rh, tot = r.c + r.w + r.u || 1, sc = (W - L - 20) / tot;
    s += `<text x="${L - 8}" y="${y + 15}" text-anchor="end" font-size="12">${esc(r.label)}</text>`;
    let x = L;
    for (const [v, col] of [[r.c, '#2E7D4F'], [r.w, '#B3261E'], [r.u, '#AAB4C2']]) { if (v) { s += `<rect x="${x}" y="${y + 3}" width="${v * sc}" height="16" fill="${col}"/><text x="${x + v * sc / 2}" y="${y + 15}" font-size="11" fill="#fff" text-anchor="middle">${v}</text>`; x += v * sc; } }
  });
  s += `<text x="${L}" y="${H - 4}" font-size="11" fill="#2E7D4F">■ correct</text><text x="${L + 70}" y="${H - 4}" font-size="11" fill="#B3261E">■ incorrect</text><text x="${L + 150}" y="${H - 4}" font-size="11" fill="#6B7684">■ unanswered</text>`;
  return s + '</svg>';
}

/* ============================================================ statistics */
function stats(recs, P = 75) {
  const n = recs.length, c = recs.filter(r => r.correct).length, u = recs.filter(r => r.unanswered).length;
  const seen = recs.filter(r => r.timeSpentMs > 0), t = seen.map(r => r.timeSpentMs / 1000);
  const ansSeen = seen.filter(r => !r.unanswered); // fastest/slowest and over/under among answered questions only
  const lim = P * 1000, over = ansSeen.filter(r => r.timeSpentMs > lim), under = ansSeen.filter(r => r.timeSpentMs <= lim); // fastest/slowest among answered questions only
  const fastest = ansSeen.length ? ansSeen.reduce((a, b) => a.timeSpentMs <= b.timeSpentMs ? a : b) : null;
  const slowest = ansSeen.length ? ansSeen.reduce((a, b) => a.timeSpentMs >= b.timeSpentMs ? a : b) : null;
  const ans = recs.filter(r => !r.unanswered);
  return { n, c, w: n - c - u, u, acc: pct(c, n), accAns: pct(c, ans.length), avg: avg(t), med: median(t), fastest, slowest,
    over: over.length, under: under.length, cOver: over.filter(r => r.correct).length, cUnder: under.filter(r => r.correct).length,
    accOver: pct(over.filter(r => r.correct).length, over.length), accUnder: pct(under.filter(r => r.correct).length, under.length), total: t.reduce((a, b) => a + b, 0) };
}
function kpis(st, extra = '') {
  const f = r => r ? `${sec1(r.timeSpentMs)} s <span class="small muted">${esc(r.questionId)}</span>` : '—';
  return `<div class="kpis">
    <div class="kpi"><b class="num">${st.n}</b><span>questions</span></div>
    <div class="kpi"><b class="num" style="color:var(--ok)">${st.c}</b><span>correct</span></div>
    <div class="kpi"><b class="num" style="color:var(--bad)">${st.w}</b><span>incorrect</span></div>
    <div class="kpi"><b class="num">${st.u}</b><span>unanswered</span></div>
    <div class="kpi"><b class="num">${st.acc}%</b><span>accuracy</span></div>
    <div class="kpi"><b class="num">${st.avg.toFixed(1)} s</b><span>average time / question</span></div>
    <div class="kpi"><b class="num">${st.med.toFixed(1)} s</b><span>median time</span></div>
    <div class="kpi"><b class="num">${f(st.fastest)}</b><span>fastest</span></div>
    <div class="kpi"><b class="num">${f(st.slowest)}</b><span>slowest</span></div>${extra}</div>`;
}
function sectionTable(groups) {
  let s = `<table class="tbl"><tr><th>Section</th><th>Accuracy</th><th>Avg time</th><th>Median</th><th>Over 75 s</th><th>Under 75 s</th><th>Correct &lt; 75 s</th><th>Correct &gt; 75 s</th><th>Unanswered</th></tr>`;
  for (const [name, recs] of groups) { const t = stats(recs); s += `<tr><td>${esc(name)}</td><td class="n">${t.acc}% (${t.c}/${t.n})</td><td class="n">${t.avg.toFixed(1)} s</td><td class="n">${t.med.toFixed(1)} s</td><td class="n">${t.over}</td><td class="n">${t.under}</td><td class="n">${t.cUnder}</td><td class="n">${t.cOver}</td><td class="n">${t.u}</td></tr>`; }
  return s + '</table>';
}

/* ============================================================ weakness analysis + recommendations (data only) */
const TIPS = {
  FS: ['Pick the element that moves most obviously and predict it first – it usually eliminates two of the three options per blank.',
       'Use a fixed scanning order for every element: position → orientation → colour. Never re-check an element you have already ruled on.',
       'Check the border rule explicitly: bounce vs. moving along the edge. Most wrong options break exactly that step.',
       'Drill: 10 figure sequences from Practice Mode with a personal 60-second target; review only those that ran over 75 s.'],
  ME: ['Find the pivot letter first (the one every other equation is written in terms of), then substitute everything into the master equation.',
       'Keep only two running numbers in your head while substituting: the pivot coefficient and the constant.',
       'Sanity-check with the 1–20 rule: a fraction or a value above 20 means a sign or order error earlier.',
       'Drill: 10 four/five-unknown systems with a 60-second target.'],
  LS: ['Before touching the "?" cell, scan the whole grid for letters that already appear four times – their fifth position is forced.',
       'If the "?" row + column show fewer than four letters, look for a helper cell in that row or column that is already decidable.',
       'Use "hidden singles": ask where a missing letter can still go in a row; often only one cell is left.',
       'Drill: 10 Hard Latin squares; say the helper cells aloud before answering.'],
  GA: ['Read the questions first and scan the passage for the table, formula or paragraph each question needs.',
       'Numbers questions: locate the formula in the passage table before calculating; most distractors are the same formula with one step missing.',
       'Mark and move after about 2 minutes on a question – the module timer is shared by all passages.'],
};
function analyse(groups) { // groups: [[code, name, recs]]
  const findings = [], recs = [], status = [];
  for (const [code, name, rr] of groups) {
    if (!rr.length) continue;
    const P = paceTarget(code), t = stats(rr, P), slow = t.avg > P, acc = t.accAns, answered = t.n - t.u;
    let lvl, txt;
    if (answered < 3) { lvl = 'warn'; txt = `Only ${answered} question${answered === 1 ? '' : 's'} answered – not enough data to judge speed or accuracy.`; }
    else if (acc >= 80 && !slow) { lvl = 'good'; txt = `Strong performance – accurate and within the ${P}-second pace.`; }
    else if (acc >= 70 && slow) { lvl = 'warn'; txt = 'Accuracy acceptable – speed needs improvement.'; }
    else if (acc < 60 && t.avg < .8 * P) { lvl = 'bad'; txt = 'Fast but inaccurate – you are answering before the rule or constraint is confirmed.'; }
    else if (acc < 60 && slow) { lvl = 'bad'; txt = 'Slow and inaccurate – both method and pace need work.'; }
    else if (acc < 60) { lvl = 'bad'; txt = 'On pace, but accuracy is low – fix the method before working on speed.'; }
    else if (!slow) { lvl = 'warn'; txt = 'On pace, accuracy can still improve.'; }
    else { lvl = 'warn'; txt = 'Below target on both accuracy and pace.'; }
    status.push({ code, name, lvl, txt, t, P });
    if (t.u) findings.push(`${name}: ${t.u} question${t.u > 1 ? 's' : ''} left unanswered. There is no penalty for guessing, so every question should get an answer before time runs out.`);
    if (answered < 3) continue;
    if (slow && acc >= 70) findings.push(`${name}: ${acc}% of answered questions are correct, but the average solving time is ${t.avg.toFixed(0)} s (pace ${P} s). The primary issue is speed rather than accuracy.`);
    if (acc < 60 && t.avg < .8 * P) findings.push(`${name}: fast (${t.avg.toFixed(0)} s average) but only ${acc}% correct – accuracy, not time, is costing points.`);
    if (t.over >= 3 && t.under >= 3 && t.accUnder - t.accOver >= 20) findings.push(`${name}: accuracy drops from ${t.accUnder}% on questions answered within ${P} s to ${t.accOver}% on questions that took longer. Long attempts are not paying off – guess and move on sooner.`);
    const byD = {}; for (const r of rr) (byD[r.difficulty] ||= []).push(r);
    if (Object.keys(byD).length > 1) for (const [d, x] of Object.entries(byD)) { const s = stats(x); if (x.length - s.u >= 3 && s.accAns < 50) findings.push(`${name}: ${d} questions are the weak spot (${s.accAns}% of ${x.length - s.u} answered).`); }
    if (slow || acc < 80) recs.push({ code, head: `${name} – ${acc}% of answered questions correct, ${t.avg.toFixed(0)} s average (pace ${P} s; ${t.over} answered questions over it).`, tips: TIPS[code] || [] });
  }
  const core = status.filter(s => s.code !== 'GA');
  if (core.length >= 2) {
    const sl = core.reduce((a, b) => a.t.avg >= b.t.avg ? a : b), fa = core.reduce((a, b) => a.t.avg <= b.t.avg ? a : b);
    if (sl.t.avg - fa.t.avg >= 15) findings.push(`Section comparison: you are slowest on ${sl.name} (${sl.t.avg.toFixed(0)} s) and fastest on ${fa.name} (${fa.t.avg.toFixed(0)} s).`);
    const best = core.reduce((a, b) => a.t.acc >= b.t.acc ? a : b), worst = core.reduce((a, b) => a.t.acc <= b.t.acc ? a : b);
    if (best.t.acc - worst.t.acc >= 15) findings.push(`Strongest: ${best.name} (${best.t.acc}%). Weakest: ${worst.name} (${worst.t.acc}%).`);
  }
  return { findings, recs, status };
}
function gaBreakdown(recs) {
  const byP = {}, byT = {}, byQ = {}, out = [];
  for (const r of recs) { (byP[r.passage] ||= []).push(r); (byT[r.topic] ||= []).push(r); (byQ[r.type] ||= []).push(r); }
  const tbl = (title, m, nameFn) => { let s = `<h3>${title}</h3><table class="tbl"><tr><th>${title.split(' ')[0]}</th><th>Questions</th><th>Accuracy</th><th>Avg time / question</th><th>Total time</th></tr>`; for (const [k, v] of Object.entries(m)) { const t = stats(v); s += `<tr><td>${esc(nameFn(k))}</td><td class="n">${t.n}</td><td class="n">${t.acc}%</td><td class="n">${t.avg.toFixed(1)} s</td><td class="n">${fmtClock(t.total * 1000)}</td></tr>`; } return s + '</table>'; };
  const pname = id => { const p = [...BANK.actual.ga, ...BANK.practice.ga].find(p => p.id === id); return p ? p.title : id; };
  let html = tbl('Passage performance', byP, pname) + tbl('Topic performance', byT, x => x) + tbl('Question-type performance', byQ, x => x);
  // data-based GA findings
  for (const [k, v] of Object.entries(byT)) { const a = v.filter(r => !r.unanswered), w = a.filter(r => !r.correct).length; if (a.length >= 2 && w >= 2 && w / a.length > .4) out.push(`Topic "${k}": ${w} wrong answers out of ${a.length} answered.`); }
  for (const [k, v] of Object.entries(byQ)) { const a = v.filter(r => !r.unanswered); if (a.length >= 3 && stats(a).acc < 50) out.push(`Question type "${k}": only ${stats(a).acc}% correct (${a.length} answered).`); }
  const first = [], rest = [];
  for (const v of Object.values(byP)) { const vv = v.filter(r => r.timeSpentMs > 0); if (vv.length >= 3) { first.push(vv[0].timeSpentMs); rest.push(...vv.slice(1).map(r => r.timeSpentMs)); } }
  if (first.length && rest.length && avg(first) > 1.8 * avg(rest)) out.push(`Passage reading takes long: the first question of each passage took ${(avg(first) / 1000).toFixed(0)} s on average versus ${(avg(rest) / 1000).toFixed(0)} s for the following questions.`);
  return { html, findings: out };
}

          <div class="nums" role="group" aria-label="value of ${L}">${Array.from({ length: 20 }, (_, i) => i + 1).map(v => `<button class="nb num ${aa[L] === v ? 'sel' : ''}" data-act="me" data-l="${L}" data-v="${v}" aria-pressed="${aa[L] === v}">${v}</button>`).join('')}</div></div>`).join('')}</div>`;
    } else {
      const p = PMAP[id];
      const passage = p.html ? `<div class="passage txt"><h3>${esc(p.title)}</h3>${p.html}</div>` : `<div class="passage">${p.images.map(h => `<img alt="Passage: ${esc(p.title)}" src="${IMG(h)}">`).join('')}</div>`;
      const stem = q.stemImages ? `<div class="stemimgs">${q.stemImages.map(h => `<img alt="Question" src="${IMG(h)}">`).join('')}</div>` : `<p class="stem">${q.question}</p>`;
      const opts = q.options.map((o, j) => `<button class="gaopt ${a === j ? 'sel' : ''}" data-act="ga" data-v="${j}" aria-pressed="${a === j}">${q.optionImages ? q.optionImages[j].map(h => `<img alt="option ${'abcd'[j]}" src="${IMG(h)}">`).join('') : `<span class="L">${'abcd'[j]})</span><span>${o}</span>`}</button>`).join('');
      const pq = p.questions.map(x => x.id), k = pq.indexOf(id);
      const strat = s.mode === 'practice' ? `<div class="strat small"><b>Your approach for this passage</b> (for strategy analytics): ${['question-first', 'passage-first', 'skim-then-question'].map(v => `<label style="margin-right:10px"><input type="radio" name="st" data-act="strat" data-p="${p.id}" value="${v}" ${s.strategy[p.id] === v ? 'checked' : ''}> ${v}</label>`).join('')}</div>` : '';
      body = `<div class="ga"><div>${passage}</div><div><p class="muted small">Passage: ${esc(p.title)} · question ${k + 1} of ${pq.length}</p>${strat}${stem}<div role="group" aria-label="answer options">${opts}</div></div></div>`;
    }
    $('#qarea').innerHTML = `<div class="qhead"><div class="qno">Question ${s.idx + 1} of ${s.qids.length}</div>
      <div class="qtime" id="qt"><div class="lbl">QUESTION TIME · TARGET 75 s</div><div class="v num" id="qtv">0.0 s</div></div></div>
      <div class="pace" id="pace"><i></i></div>${body}`;
    $('#flagBtn').textContent = r.flagged ? 'Unflag' : 'Flag';
    this.palette(s); this.tick(s); window.scrollTo(0, 0);
  },
  palette(s) {
    $('#pal').innerHTML = s.qids.map((id, i) => { const r = s.records[id]; return `<button class="${isAnswered(QMAP[id], r.selectedAnswer) ? 'ans' : ''} ${r.flagged ? 'flag' : ''} ${i === s.idx ? 'cur' : ''}" data-act="jump" data-i="${i}" aria-label="question ${i + 1}${r.flagged ? ', flagged' : ''}">${i + 1}</button>`; }).join('');
  },
  tick(s) {
    const t = $('#clockT'); if (!t) return;
    const rem = s.remaining(), clock = $('#clock');
    t.textContent = rem == null ? fmtClock(s.elapsed()) : fmtClock(rem);
    if (rem != null) {
      clock.classList.toggle('warn', rem <= 5 * 60e3 && rem > 60e3); clock.classList.toggle('crit', rem <= 60e3);
      if (rem <= 5 * 60e3 && !s.warned.five) { s.warned.five = 1; toast('5 minutes left in this section.'); }
      if (rem <= 60e3 && !s.warned.one) { s.warned.one = 1; toast('1 minute left – make sure every question has an answer.'); }
    }
    const qt = s.qTime(), v = $('#qtv'), pace = $('#pace'), box = $('#qt');
    if (v) {
      v.textContent = qt > TARGET ? `${sec1(qt)} s · +${sec1(qt - TARGET)} s over` : `${sec1(qt)} s`;
      box.classList.toggle('over', qt > TARGET); box.classList.toggle('warn', qt > 60000 && qt <= TARGET);
      pace.classList.toggle('over', qt > TARGET); pace.classList.toggle('warn', qt > 60000 && qt <= TARGET);
      pace.firstChild.style.width = Math.min(100, 100 * qt / TARGET) + '%';
    }
    if (Math.random() < .03) s.persist();
  },

  /* ---------------- results ---------------- */

    const st = stats(res.records), a = App.attempt;
    const more = a.mode === 'actual' && a.flow === 'full' && a.sections.length < 4;
    app().innerHTML = `<div class="wrap">${timeout ? `<div class="status bad"><b>Time is up.</b> The section was submitted automatically; answering is closed.</div>` : ''}
      <h1>${esc(SEC[res.section] || res.label)} – section results</h1>
      <p class="muted">Time used ${fmtClock(res.elapsedMs)}${res.limitMs ? ` of ${fmtClock(res.limitMs)}` : ''}.</p>
      ${kpis(st)}
      <div class="row"><button class="btn primary" data-act="review" data-scope="last">Review every question with answers</button>
      ${more ? `<button class="btn" data-act="continue">Continue to the next section</button>` : `<button class="btn" data-act="continue">${a.mode === 'actual' ? 'Overall results & analytics' : 'Back to practice'}</button>`}
      ${a.mode === 'practice' ? `<button class="btn" data-act="go" data-to="practiceAnalytics">Practice analytics</button>` : ''}</div></div>`;
  },

  overall(a) {
    App.viewAttempt = a;
    const secs = a.sections, core = secs.filter(s => s.section !== 'GA'), ga = secs.find(s => s.section === 'GA');

    const groups = secs.map(s => [s.section, SEC[s.section], s.records]);
    const an = analyse(groups);
    const gb = ga ? gaBreakdown(ga.records) : null;
    const findings = an.findings.concat(gb ? gb.findings : []);
    const chartRows = secs.map(s => ({ label: SEC[s.section], st: stats(s.records) }));
    app().innerHTML = `<div class="wrap"><h1>Results and analytics</h1><p class="muted">${new Date(a.startedAt).toLocaleString()} · ${esc(a.kind)}</p>
      ${core.length ? `<h2>Core Module</h2>${kpis(stats(coreRecs))}${sectionTable(core.map(s => [SEC[s.section], s.records]))}` : ''}
      ${ga ? `<h2>General Academic Module</h2>${kpis(stats(ga.records))}${gb.html}` : ''}
      <h2>Statistics</h2><div class="charts">
        <div class="chart"><h4>Accuracy by section</h4>${barChart(chartRows.map(r => ({ label: r.label, v: r.st.acc, color: r.st.acc >= 70 ? '#2E7D4F' : '#B3261E' })), { max: 100, unit: '%' })}</div>
        <div class="chart"><h4>Average time per question vs 75 s target</h4>${barChart(chartRows.map(r => ({ label: r.label, v: r.st.avg, color: r.st.avg > 75 ? '#B7791F' : '#4B6A88' })), { ref: 75, unit: ' s', fmt: v => v.toFixed(1), refLabel: '75 s' })}</div>
        <div class="chart"><h4>Correct vs incorrect</h4>${stackChart(chartRows.map(r => ({ label: r.label, c: r.st.c, w: r.st.w, u: r.st.u })))}</div>
        <div class="chart"><h4>Questions over / under 75 s</h4>${stackChart(chartRows.map(r => ({ label: r.label, c: r.st.under, w: r.st.over, u: r.st.n - r.st.over - r.st.under }))).replace('■ correct', '■ ≤ 75 s').replace('■ incorrect', '■ > 75 s').replace('■ unanswered', '■ not opened')}</div>
      </div>
      ${this.analysisHtml(an, findings)}
      <div class="row"><button class="btn primary" data-act="review" data-scope="attempt">Review all questions</button><button class="btn" data-act="go" data-to="welcome">Home</button></div></div>`;
  },
  analysisHtml(an, findings) {
    return `<h2>Personal weakness analysis</h2>
      ${an.status.map(s => `<div class="status ${s.lvl}"><b>${esc(s.name)}</b> – ${s.t.accAns}% of answered questions correct (${s.t.c} of ${s.t.n} overall), average ${s.t.avg.toFixed(0)} s (pace ${s.P} s). ${esc(s.txt)}</div>`).join('')}
      ${findings.length ? `<ul class="recs">${findings.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : '<p class="muted">No weak pattern stands out in this data set.</p>'}
      <h2>Recommendations</h2>
      ${an.recs.length ? an.recs.map(r => `<h3>${esc(r.head)}</h3><ol class="recs">${r.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ol>`).join('') : '<p>All sections are accurate and on pace. Keep one timed full test per week and review only the questions that exceeded 75 s.</p>'}`;
  },

  /* ---------------- review ---------------- */
  review(sections, filter = 'all') {
    const all = sections.flatMap(s => s.records.map((r, i) => ({ r, i, sec: s.section })));
    const f = { all: () => true, wrong: x => !x.r.correct, over: x => x.r.exceededTarget, flag: x => x.r.flagged }[filter];
    const items = all.filter(f);
    App.reviewSections = sections;
    app().innerHTML = `<div class="wrap"><h1>Answer review</h1>
      <div class="filters">${[['all', 'All'], ['wrong', 'Incorrect & unanswered'], ['over', 'Over 75 s'], ['flag', 'Flagged']].map(([k, l]) => `<button class="${k === filter ? 'on' : ''}" data-act="rfilter" data-f="${k}">${l}</button>`).join('')}</div>
      <p class="muted">${items.length} question${items.length === 1 ? '' : 's'}.</p>
      ${items.map(x => this.reviewItem(x.r, x.i, x.sec)).join('')}
      <div class="row"><button class="btn" data-act="back">Back</button><button class="btn" data-act="go" data-to="welcome">Home</button></div></div>`;
  },
  reviewItem(r, i, sec) {
    const q = QMAP[r.questionId], a = r.selectedAnswer, cls = r.correct ? 'ok' : r.unanswered ? 'skip' : 'bad';
    const res = r.correct ? 'CORRECT' : r.unanswered ? 'UNANSWERED' : 'INCORRECT';
    const oc = (ok, mine) => ok ? 'o-ok' : mine ? 'o-bad' : '';
    let content = '';
    if (q.section === 'FS') {
      const col = (k, b) => `<div class="fscol"><h4>Matrix ${5 + b}</h4>${q.options[k].map((h, j) => `<div class="optimg ${oc(q.correctAnswer[b] === j, a && a[b] === j)}"><span class="L">${'ABC'[j]}</span><img alt="" src="${IMG(h)}"></div>`).join('')}</div>`;
      content = `<div class="fig"><img alt="" src="${IMG(q.image)}"></div><div class="fsopts">${col('blank1', 0)}${col('blank2', 1)}</div>`;
    } else if (q.section === 'LS') {
      content = `<div class="lswrap"><div class="fig"><img alt="" src="${IMG(q.image)}"></div><div class="letters">${LET.split('').map(L => `<div class="lbtn ${oc(q.correctAnswer === L, a === L)}" style="display:flex;align-items:center;justify-content:center">${L}</div>`).join('')}</div></div>`;
    } else if (q.section === 'ME') {
      content = `<div class="eqs num">${q.equations.map(e => `<div>${esc(e)}</div>`).join('')}</div>
        <table class="tbl" style="max-width:420px"><tr><th>Letter</th><th>Your value</th><th>Correct</th></tr>${q.letters.map(L => `<tr><td>${L}</td><td class="n ${a && a[L] != null ? (a[L] === q.correctAnswer[L] ? 'o-ok' : 'o-bad') : ''}">${a && a[L] != null ? a[L] : '—'}</td><td class="n">${q.correctAnswer[L]}</td></tr>`).join('')}</table>`;
    } else {
      const p = PMAP[q.id];
      const stem = q.stemImages ? `<div class="stemimgs">${q.stemImages.map(h => `<img alt="" src="${IMG(h)}">`).join('')}</div>` : `<p class="stem">${q.question}</p>`;
      content = `<p class="muted small">Passage: ${esc(p.title)} (${esc(p.topic)})</p>${stem}${q.options.map((o, j) => `<div class="gaopt ${oc(q.correctAnswer === j, a === j)}">${q.optionImages ? q.optionImages[j].map(h => `<img alt="" src="${IMG(h)}">`).join('') : `<span class="L">${'abcd'[j]})</span><span>${o}</span>`}</div>`).join('')}`;
    }
    const src = q.sourceReference;
    return `<div class="rv ${cls}"><h3 style="margin-top:0">Question ${i + 1} — ${esc(SEC[q.section])} <span class="tag">${esc(q.difficulty)}</span> <span class="tag">${esc(q.type)}</span></h3>
      ${content}
      <div class="meta"><div>Your answer: <b>${esc(fmtAnswer(q, a))}</b></div><div>Correct answer: <b>${esc(fmtKey(q))}</b></div><div>Result: <span class="res ${cls}">${res}</span></div>
      <div>Time used: <b class="num">${sec1(r.timeSpentMs)} s</b></div><div>Target: 75 s${q.section === 'GA' ? ` (GA module pace ≈ ${paceTarget('GA')} s: ${r.timeSpentMs > paceTarget('GA') * 1000 ? 'over' : 'within'})` : ''}</div><div>Status: <b style="color:${r.exceededTarget ? 'var(--bad)' : 'var(--ok)'}">${r.exceededTarget ? `OVER TARGET (+${sec1(r.timeSpentMs - TARGET)} s)` : 'within target'}</b></div>
      <div>Visits: ${r.visits.length}${r.flagged ? ' · flagged' : ''}${r.changes ? ` · answer changed ${r.changes}×` : ''}</div></div>
      <div class="why"><b>Why:</b> ${esc(q.explanation)}</div>
      <p class="small muted" style="margin:.6em 0 0">Source: ${esc(src.document)}, page ${src.page} (${esc(src.section)})</p></div>`;
  },

  /* ---------------- practice ---------------- */

  practiceAnalytics() {
    const recs = practiceRecords(), core = recs.filter(r => r.section !== 'GA'), ga = recs.filter(r => r.section === 'GA');
    if (!recs.length) { app().innerHTML = `<div class="wrap"><h1>Practice analytics</h1><p>No practice data yet. Finish a practice session and the analysis appears here.</p><button class="btn primary" data-act="go" data-to="practiceHome">Open practice</button></div>`; return; }
    const types = ['FS', 'LS', 'ME'], diffs = ['Easy', 'Medium', 'Hard'];
    let matrix = `<table class="tbl"><tr><th>Type</th>${diffs.map(d => `<th>${d} accuracy</th>`).join('')}<th>Avg time</th><th>Questions</th></tr>`;
    for (const t of types) { const x = core.filter(r => r.section === t); matrix += `<tr><td>${SEC[t]}</td>${diffs.map(d => { const y = x.filter(r => r.difficulty === d); return `<td class="n">${y.length ? stats(y).acc + '% (' + y.length + ')' : '—'}</td>`; }).join('')}<td class="n">${x.length ? stats(x).avg.toFixed(1) + ' s' : '—'}</td><td class="n">${x.length}</td></tr>`; }
    matrix += '</table>';
    const bands = [['Under 60 s', 0, 60], ['60–75 s', 60, 75], ['75–90 s', 75, 90], ['90–120 s', 90, 120], ['120+ s', 120, 1e9]];
    const timed = core.filter(r => r.timeSpentMs > 0);
    let band = `<table class="tbl"><tr><th>Time band</th><th>Questions</th><th>Share</th><th>Accuracy</th></tr>`;
    for (const [l, lo, hi] of bands) { const x = timed.filter(r => r.timeSpentMs / 1000 >= lo && r.timeSpentMs / 1000 < hi); band += `<tr><td>${l}</td><td class="n">${x.length}</td><td class="n">${pct(x.length, timed.length)}%</td><td class="n">${x.length ? stats(x).acc + '%' : '—'}</td></tr>`; }
    band += '</table>';
    const cnt = {}; for (const r of core.concat(ga)) if (!r.correct) cnt[r.questionId] = (cnt[r.questionId] || 0) + 1;
    const rep = Object.entries(cnt).filter(([, n]) => n >= 2);
    const lastRows = core.slice(-60).reverse().map(r => { const q = QMAP[r.questionId]; return `<tr><td>${esc(q.id)}</td><td>${esc(q.type)}</td><td>${esc(q.difficulty)}</td><td class="n">75 s</td><td class="n">${sec1(r.timeSpentMs)} s</td><td class="n" style="color:${r.timeSpentMs > TARGET ? 'var(--bad)' : 'var(--ok)'}">${r.timeSpentMs > TARGET ? '+' : '−'}${sec1(Math.abs(r.timeSpentMs - TARGET))} s</td><td><span class="res ${r.correct ? 'ok' : r.unanswered ? 'skip' : 'bad'}">${r.correct ? 'Correct' : r.unanswered ? 'Unanswered' : 'Incorrect'}</span></td></tr>`; }).join('');
    const an = analyse(types.map(t => [t, SEC[t], core.filter(r => r.section === t)]).concat(ga.length ? [['GA', SEC.GA, ga]] : []));
    const gb = ga.length ? gaBreakdown(ga) : null;
    // strategy comparison (only with enough data)
    const byS = {}; for (const r of ga) if (r.strategy) (byS[r.strategy] ||= { passages: new Set(), recs: [] }), byS[r.strategy].passages.add(r.passage + '@' + r.attemptSection), byS[r.strategy].recs.push(r);
    const sRows = Object.entries(byS).map(([k, v]) => ({ k, n: v.passages.size, st: stats(v.recs) }));
    const enough = sRows.filter(x => x.n >= 3);
    let strat = `<table class="tbl"><tr><th>Strategy</th><th>Passages</th><th>Accuracy</th><th>Avg time / question</th></tr>${sRows.map(x => `<tr><td>${x.k}</td><td class="n">${x.n}</td><td class="n">${x.st.acc}%</td><td class="n">${x.st.avg.toFixed(1)} s</td></tr>`).join('')}</table>`;
    if (enough.length >= 2) { const best = enough.reduce((a, b) => (a.st.acc - a.st.avg / 10) >= (b.st.acc - b.st.avg / 10) ? a : b); strat += `<div class="status good">With at least 3 passages per strategy, <b>${best.k}</b> gives you the best result: ${best.st.acc}% accuracy at ${best.st.avg.toFixed(0)} s per question.</div>`; }
    else strat += `<p class="muted">A strategy recommendation needs at least 3 tagged passages for at least two strategies. So far: ${sRows.length ? sRows.map(x => `${x.k} ${x.n}`).join(', ') : 'no tagged passages'}.</p>`;
    const chartT = types.map(t => ({ label: SEC[t], st: stats(core.filter(r => r.section === t)) })).filter(x => x.st.n);
    app().innerHTML = `<div class="wrap"><h1>Practice analytics</h1><p class="muted">Based on all ${recs.length} practice answers recorded in this browser.</p>
      ${core.length ? `<h2>Core practice</h2>${kpis(stats(core))}<h3>Accuracy by type and difficulty</h3>${matrix}<h3>Time efficiency</h3>${band}
      <div class="charts"><div class="chart"><h4>Accuracy by type</h4>${barChart(chartT.map(x => ({ label: x.label, v: x.st.acc })), { max: 100, unit: '%' })}</div>
      <div class="chart"><h4>Average time vs 75 s target</h4>${barChart(chartT.map(x => ({ label: x.label, v: x.st.avg, color: x.st.avg > 75 ? '#B7791F' : '#4B6A88' })), { ref: 75, unit: ' s', fmt: v => v.toFixed(1), refLabel: '75 s' })}</div>
      <div class="chart"><h4>Accuracy by time band</h4>${barChart(bands.map(([l, lo, hi]) => { const x = timed.filter(r => r.timeSpentMs / 1000 >= lo && r.timeSpentMs / 1000 < hi); return { label: l, v: x.length ? stats(x).acc : 0 }; }), { max: 100, unit: '%' })}</div>
      <div class="chart"><h4>Correct vs incorrect by type</h4>${stackChart(chartT.map(x => ({ label: x.label, c: x.st.c, w: x.st.w, u: x.st.u })))}</div></div>
      <h3>Question timing log (latest first)</h3><table class="tbl"><tr><th>Question</th><th>Type</th><th>Difficulty</th><th>Target</th><th>Actual</th><th>Difference</th><th>Result</th></tr>${lastRows}</table>` : ''}
      ${ga.length ? `<h2>General Academic practice</h2>${kpis(stats(ga))}${gb.html}<h3>Reading strategy</h3>${strat}` : ''}
      <h3>Repeated mistakes</h3>${rep.length ? `<ul>${rep.map(([id, n]) => `<li>${esc(QMAP[id]?.type || '')} ${esc(id)} – wrong ${n} times</li>`).join('')}</ul>` : '<p class="muted">No question has been answered wrongly twice yet.</p>'}
      ${this.analysisHtml(an, an.findings.concat(gb ? gb.findings : []))}
      <div class="row"><button class="btn primary" data-act="go" data-to="practiceHome">Back to practice</button><button class="btn" data-act="go" data-to="welcome">Home</button></div></div>`;
  },

  history() {
    const at = [...store.data.attempts].reverse();
    app().innerHTML = `<div class="wrap"><h1>Past attempts</h1>${at.length ? `<table class="tbl"><tr><th>Date</th><th>Mode</th><th>Sections</th><th>Accuracy</th><th></th></tr>${at.map(a => { const r = a.sections.flatMap(s => s.records), t = stats(r); return `<tr><td>${new Date(a.startedAt).toLocaleString()}</td><td>${esc(a.kind)}</td><td>${a.sections.map(s => s.section).join(', ') || '—'}</td><td class="n">${r.length ? t.acc + '%' : '—'}</td><td>${a.sections.length ? `<button class="btn" data-act="openAttempt" data-id="${a.id}">Open</button>` : ''}</td></tr>`; }).join('')}</table>` : '<p>No attempts yet.</p>'}
      <div class="row"><button class="btn" data-act="go" data-to="welcome">Home</button>${at.length ? `<button class="btn danger" data-act="clearAll">Delete all saved results</button>` : ''}</div></div>`;
  },

  about() {
    const qc = BANK.qc;
    app().innerHTML = `<div class="wrap"><h1>Format and sources</h1>
      <p>Built from the preparation material in your folder. The official structure comes from “dMAT – General Academic Module, Preparatory Materials for Test Takers” (g.a.s.t., as at 02.09.2026).</p>
      <h2>How questions were checked</h2>
      <table class="facts"><tr><th>Type</th><th>Check</th><th>Kept</th><th>Rejected</th></tr>
      <tr><td>Mathematical Equations</td><td>Exact solver: the system must have exactly one solution with every letter an integer 1–20, matching the source key.</td><td class="n">${qc.me_verified}</td><td class="n">${qc.me_rejected}</td></tr>
      <tr><td>Latin Squares</td><td>Grid read from the PDF; complete search confirms the “?” has exactly one possible letter, matching the key; explanation from a step-by-step deduction.</td><td class="n">${qc.ls_verified}</td><td class="n">${qc.ls_rejected}</td></tr>
      <tr><td>Figure Sequences</td><td>Shapes read from the figures; movement and rotation rules fitted to Matrices 1–4; the predicted Matrix 5 and 6 must match exactly one option each and the source key. Official exercises use the official solutions.</td><td class="n">${qc.fs_verified}</td><td class="n">${qc.fs_rejected}</td></tr></table>
      <details><summary>Rejected source questions (${qc.me_rejected + qc.ls_rejected + qc.fs_rejected})</summary><pre class="small" style="white-space:pre-wrap">${esc([...qc.rejects.me, ...qc.rejects.ls, ...qc.rejects.fs].join('\n'))}</pre></details>
      <p>All figures and grids are cropped from the source PDFs and embedded in this file; nothing is loaded from the internet.</p>
      <button class="btn" data-act="go" data-to="welcome">Home</button></div>`;
  },
};

/* ============================================================ practice helpers */
function practiceRecords() { return store.data.attempts.filter(a => a.mode === 'practice').flatMap(a => a.sections.flatMap((s, si) => s.records.filter(r => QMAP[r.questionId]).map(r => Object.assign({ attemptSection: a.id + si }, r)))); }
function practicePool() {
  const f = App.pf || { types: ['FS', 'LS', 'ME'], diffs: ['Easy', 'Medium', 'Hard'], only: 'all' };
  const hist = practiceRecords(), seen = new Set(hist.map(r => r.questionId)), last = {};
  for (const r of hist) last[r.questionId] = r;           // attempts are chronological -> latest result wins
  const wrong = new Set(Object.values(last).filter(r => !r.correct).map(r => r.questionId));
  return BANK.practice.core.filter(q => f.types.includes(q.section) && f.diffs.includes(q.difficulty) && (f.only === 'all' || (f.only === 'new' ? !seen.has(q.id) : wrong.has(q.id))));
}

/* ============================================================ actions */
const ACT = {
  go: d => { closeModal(); UI[d.to](); },
  actual: d => startActual(d.flow),
  begin: d => beginSection(actualCfg(d.sec)),
  endbreak: () => { clearInterval(App.breakTimer); if (App.attempt) { App.attempt.breakDone = true; UI.sectionIntro('GA', 4); } },
  prev: () => { const s = App.session; if (s && !s.submitted && s.idx > 0) { s.enter(s.idx - 1); s.persist(); UI.question(s); } },
  next: () => { const s = App.session; if (s && !s.submitted && s.idx < s.qids.length - 1) { s.enter(s.idx + 1); s.persist(); UI.question(s); } },
  jump: d => { const s = App.session; if (s && !s.submitted) { s.enter(+d.i); s.persist(); UI.question(s); } },
  flag: () => { const s = App.session; if (!s || s.submitted) return; const r = s.cur(); r.flagged = !r.flagged; $('#flagBtn').textContent = r.flagged ? 'Unflag' : 'Flag'; UI.palette(s); s.persist(); },
  fs: d => { const s = App.session; if (!s || s.submitted) return; const cur = s.cur().selectedAnswer ? [...s.cur().selectedAnswer] : [null, null]; cur[+d.b] = +d.o; s.answer(cur); UI.question(s); },
  ls: d => { const s = App.session; if (!s || s.submitted) return; s.answer(d.v); UI.question(s); },
  me: d => { const s = App.session; if (!s || s.submitted) return; const cur = Object.assign({}, s.cur().selectedAnswer || {}); cur[d.l] = +d.v; s.answer(cur); UI.question(s); },
  ga: d => { const s = App.session; if (!s || s.submitted) return; s.answer(+d.v); UI.question(s); },
  strat: (d, el) => { const s = App.session; if (s && !s.submitted) { s.strategy[d.p] = el.value; s.persist(); } },
  submitAsk: () => {
    const s = App.session; if (!s || s.submitted) return;
    const open = s.qids.filter(id => !isAnswered(QMAP[id], s.records[id].selectedAnswer)).length;
    modal(`<h3 style="margin-top:0">${s.limitMs ? 'Submit this section?' : 'Finish this practice session?'}</h3><p>${open ? `<b>${open}</b> question${open > 1 ? 's are' : ' is'} still unanswered.` : 'All questions are answered.'} ${s.limitMs ? 'You cannot return to this section after submitting.' : ''}</p>
      <div class="row"><button class="btn primary" data-act="submitYes">${s.limitMs ? 'Submit section' : 'Finish and see answers'}</button><button class="btn" data-act="closeModal">Keep working</button></div>`);
  },
  submitYes: (d, el) => { el.disabled = true; closeModal(); finishSection('submitted'); },
  closeModal: () => closeModal(),
  continue: () => nextAfterSection(),
  review: d => { const a = App.attempt; UI.review(d.scope === 'last' ? [App.lastSection] : (App.viewAttempt || a).sections); App.reviewBack = d.scope; },
  rfilter: d => UI.review(App.reviewSections, d.f),
  back: () => { if (App.reviewBack === 'last') UI.sectionResults(App.lastSection, false); else if (App.reviewBack === 'history') UI.history(); else UI.overall(App.viewAttempt || App.attempt); },
  pf: d => { const f = App.pf; if (d.k === 'only') f.only = d.v; else { const a = f[d.k]; const i = a.indexOf(d.v); if (i >= 0) { if (a.length > 1) a.splice(i, 1); } else a.push(d.v); } UI.practiceHome(); },
  pstart: () => {
    const pool = practicePool(); if (!pool.length) return;
    App.attempt = newAttempt('practice', 'practice-core', 'practice');
    const s = new Session({ mode: 'practice', kind: 'practice-core', attemptId: App.attempt.id, module: 'PRACTICE · CORE MODULE', label: 'MIXED PRACTICE', section: 'CORE', limitMs: null, qids: pool.map(q => q.id) });
    App.session = s; s.start(); s.persist(); Driver.attach(s); UI.test(s);
  },
  gastart: () => {
    const ids = [...document.querySelectorAll('[data-gap]:checked')].map(x => x.dataset.gap);
    if (!ids.length) return toast('Select at least one passage.');
    App.attempt = newAttempt('practice', 'practice-ga', 'practice');
    const qids = BANK.practice.ga.filter(p => ids.includes(p.id)).flatMap(p => p.questions.map(q => q.id));
    const s = new Session({ mode: 'practice', kind: 'practice-ga', attemptId: App.attempt.id, module: 'PRACTICE · SUBJECT MODULE', label: 'GENERAL ACADEMIC PRACTICE', section: 'GA', limitMs: null, qids });
    App.session = s; s.start(); s.persist(); Driver.attach(s); UI.test(s);
  },
  openAttempt: d => { const a = store.data.attempts.find(x => x.id === d.id); if (!a) return; App.viewAttempt = a; App.attempt = a; if (a.mode === 'practice') { App.lastSection = a.sections[a.sections.length - 1]; UI.review(a.sections); App.reviewBack = 'history'; } else UI.overall(a); },
  clearAll: () => modal(`<h3 style="margin-top:0">Delete all saved results?</h3><p>This removes every attempt and all practice history stored in this browser.</p><div class="row"><button class="btn danger" data-act="clearYes">Delete everything</button><button class="btn" data-act="closeModal">Cancel</button></div>`),
  clearYes: () => { store.data = { attempts: [], inprogress: null }; store.save(); closeModal(); UI.welcome(); },
  resume: () => {
    const ip = store.data.inprogress; if (!ip) return UI.welcome();
    App.attempt = ip.attempt || store.data.attempts.find(a => a.id === ip.cfg.attemptId) || newAttempt(ip.cfg.mode, ip.cfg.kind, ip.cfg.mode === 'practice' ? 'practice' : ip.cfg.section);
    const s = new Session(Object.assign({}, ip.cfg)); s.records = ip.records; s.idx = ip.idx; s.strategy = ip.strategy || {};
    // close the visit that was open when the page was saved; its time is already inside timeSpentMs
    const r = s.records[s.qids[s.idx]], open = r.visits[r.visits.length - 1];
    if (open && open.end == null) { open.end = ip.savedAt; open.ms = Math.max(0, r.timeSpentMs - r.visits.slice(0, -1).reduce((x, v) => x + v.ms, 0)); }
    const away = Math.max(0, Date.now() - ip.savedAt);   // the exam clock keeps running while the page is closed
    App.session = s; s.start(ip.elapsed + away); Driver.attach(s); UI.test(s);
    if (s.remaining() === 0) finishSection('timeout');
  },
  dropFull: d => { const a = store.data.attempts.find(x => x.id === d.id); if (a) { a.complete = true; saveAttempt(a); } UI.welcome(); },
  contFull: d => { const a = store.data.attempts.find(x => x.id === d.id); if (!a) return; App.attempt = a; nextAfterSection(); },
  discard: () => { store.data.inprogress = null; store.save(); UI.welcome(); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return; const f = ACT[el.dataset.act]; if (f) f(el.dataset, el); });
document.addEventListener('change', e => { const el = e.target.closest('input[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el.dataset, el); });
document.addEventListener('keydown', e => {
  const s = App.session; if (!s || s.submitted || document.querySelector('.scrim') || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') ACT.next(); else if (e.key === 'ArrowLeft') ACT.prev();
  else if (QMAP[s.qids[s.idx]].section === 'LS' && /^[a-eA-E]$/.test(e.key)) ACT.ls({ v: e.key.toUpperCase() });
});
// keep the current question's time when the tab is closed mid-section
if (typeof window !== 'undefined') window.addEventListener('pagehide', () => { if (App.session && !App.session.submitted) App.session.persist(); });

/* ============================================================ boot */
if (typeof window !== 'undefined' && BANK) { indexBank(); store.load(); UI.welcome(); }
</script>
</body>
</html>
